<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Us</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f1f5f9;
			color: #172033;
			font-family: Arial, Helvetica, sans-serif;
		}
		.contact-card {
			width: min(100%, 560px);
			padding: 36px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 16px 45px rgba(23, 32, 51, .1);
		}
		h1 { margin: 0 0 8px; font-size: 2rem; }
		.intro { margin: 0 0 28px; color: #64748b; line-height: 1.5; }
		.field { margin-bottom: 18px; }
		label { display: block; margin-bottom: 7px; font-weight: 600; font-size: .95rem; }
		input, textarea {
			width: 100%;
			padding: 12px 14px;
			border: 1px solid #cbd5e1;
			border-radius: 8px;
			font: inherit;
			color: inherit;
		}
		input:focus, textarea:focus { outline: 3px solid #bfdbfe; border-color: #2563eb; }
		textarea { min-height: 140px; resize: vertical; }
		button {
			width: 100%;
			padding: 13px 18px;
			border: 0;
			border-radius: 8px;
			background: #2563eb;
			color: white;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}
		button:hover { background: #1d4ed8; }
		@media (max-width: 480px) { .contact-card { padding: 26px 20px; } }
	</style>
</head>
<body>
	<main class="contact-card">
		<h1>Contact us</h1>
		<p class="intro">Have a question or need help? Send us a message and we’ll get back to you.</p>
		<form action="#" method="post">
			<div class="field">
				<label for="name">Your name</label>
				<input id="name" name="name" type="text" autocomplete="name" required>
			</div>
			<div class="field">
				<label for="email">Email address</label>
				<input id="email" name="email" type="email" autocomplete="email" required>
			</div>
			<div class="field">
				<label for="subject">Subject</label>
				<input id="subject" name="subject" type="text" required>
			</div>
			<div class="field">
				<label for="message">Message</label>
				<textarea id="message" name="message" required></textarea>
			</div>
			<button type="submit">Send message</button>
		</form>
	</main>
</body>
</html>
